name: Despliegue de Puerto Umbral Next a GitHub Pages (Sovereign WebGL v6.0)

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Evitar Jekyll en GitHub Pages
        run: |
          touch docs/.nojekyll

      - name: Sincronizar metadatos y SEO (llms.txt, robots, sitemaps)
        run: |
          mkdir -p docs/.well-known
          [ -f llms.txt ] && cp llms.txt docs/llms.txt && cp llms.txt docs/.well-known/llms.txt || true
          [ -f llms-full.txt ] && cp llms-full.txt docs/llms-full.txt || true
          [ -f context.json ] && cp context.json docs/context.json || true
          [ -f robots.txt ] && cp robots.txt docs/robots.txt || true
          [ -f sitemap.xml ] && cp sitemap.xml docs/sitemap.xml || true
          [ -f BingSiteAuth.xml ] && cp BingSiteAuth.xml docs/BingSiteAuth.xml || true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
