# ==============================================================================
# Puerto Umbral - Configuracion de Produccion para Shiny Server
# Plataforma de Ontologia Territorial y Geotensores (Tomo II)
# ==============================================================================

# Instruir a Shiny Server para ejecutar las aplicaciones como usuario 'shiny'
run_as shiny;

# Definir la ubicacion del archivo de registro principal
log_dir /var/log/shiny-server;

# Servidor HTTP en el puerto 3838
server {
  listen 3838 0.0.0.0;

  # Definir la ruta base para servir la aplicacion
  location / {
    # Servir la aplicacion Puerto Umbral directamente en la raiz
    app_dir /srv/shiny-server/app;

    # Registro de log detallado por sesion de usuario
    log_dir /var/log/shiny-server;

    # Tiempo de inactividad antes de suspender el proceso R inactivo (30 minutos)
    app_idle_timeout 1800;

    # Desactivar la lista de directorios
    directory_index off;

    # Permitir trazas de depuracion si se activa PUERTO_DEBUG=TRUE
    sanitize_errors false;
  }
}
